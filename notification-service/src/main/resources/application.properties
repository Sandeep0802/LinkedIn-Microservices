spring.application.name=notification-service
server.port=8085

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.type.mapping=\
com.sandeep.userservice.event.UserCreatedEvent:com.sandeep.notificationservice.event.UserCreatedEvent,\
com.sandeep.userservice.event.ConnectionRequestedEvent:com.sandeep.notificationservice.event.ConnectionRequestedEvent,\
com.sandeep.userservice.event.ConnectionAcceptedEvent:com.sandeep.notificationservice.event.ConnectionAcceptedEvent,\
com.sandeep.postservice.event.PostLikedEvent:com.sandeep.notificationservice.event.PostLikedEvent,\
com.sandeep.postservice.event.PostCommentedEvent:com.sandeep.notificationservice.event.PostCommentedEvent

management.endpoints.web.exposure.include=health,info